<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- One arrow, flanked by speed streaks: several streams, one fast download. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lane" x1="0" y1="190" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="200" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="232" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="232" fill="url(#sheen)"/>
  <rect x="41.5" y="41.5" width="941" height="941" rx="230.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  <g filter="url(#lift)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="88">
    <path d="M512 200 V 640" stroke="url(#lane)"/>
    <path d="M336 476 L 512 652 L 688 476" stroke="#FFFFFF"/>
    <path d="M340 214 V 352" stroke="url(#streak)" stroke-width="64"/>
    <path d="M684 214 V 352" stroke="url(#streak)" stroke-width="64"/>
    <path d="M330 812 H 694" stroke="#FFFFFF"/>
  </g>
</svg>
