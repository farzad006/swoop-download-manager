[package]
name = "swoop-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "http2", "charset", "system-proxy", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tokio-util = "0.7.20"

[dev-dependencies]
swoop-testserver = { path = "../../tools/testserver" }
sha2 = "0.11.1"
tempfile = "3.27.0"
